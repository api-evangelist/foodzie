name: Foodzie
description: >-
  Foodzie was an online marketplace, founded in 2008 and based in San Francisco,
  that let people discover and buy food directly from small artisan producers,
  and later ran a monthly tasting-box subscription service. It raised roughly
  $1M from investors including Uncork Capital (formerly SoftTech VC) and Jeff
  Clavier, and was acquired by the video-commerce company Joyus in June 2012,
  becoming "Joyus Food" before the subscription service was wound down. The
  company is defunct; the foodzie.com domain is no longer operated by the
  original business, and no public API, developer portal, or machine-readable
  surface exists to enrich.
